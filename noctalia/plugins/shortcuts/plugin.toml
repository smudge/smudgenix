id          = "smudgenix/shortcuts"
name        = "Shortcuts"
version     = "0.3.0"
plugin_api  = 56
author      = "smudgenix"
icon        = "keyboard"
description = "Super's shortcuts, while you hold it (smudgenix.desktop.leader): in a panel, and on the bar's buttons."

# A button that opens something (its `actions`), and shows its shortcut with
# the rest of Super's.
[[widget]]
id    = "button"
entry = "button.luau"

  [[widget.setting]]
  key       = "glyph"
  type      = "glyph"
  label_key = "settings.glyph.label"
  default   = "search"

  [[widget.setting]]
  key             = "keys"
  type            = "string"
  label_key       = "settings.keys.label"
  description_key = "settings.keys.description"
  default         = ""

  [[widget.setting]]
  key       = "tooltip"
  type      = "string"
  label_key = "settings.tooltip.label"
  default   = ""

# Never takes the keyboard, so the shortcut you press still goes to niri, and
# typing to the window you're in.
[[panel]]
id                       = "keys"
entry                    = "panel.luau"
width                    = 980
height                   = "content"
max_height               = 760
placement                = "attached"
position                 = "center"
open_near_click          = false
keyboard_focus           = "none"
dismiss_on_outside_click = false

# The same, from a key (Super+Shift+/), until Esc or a click elsewhere.
[[panel]]
id               = "list"
entry            = "panel.luau"
width            = 980
height           = "content"
max_height       = 760
placement        = "attached"
position         = "center"
open_near_click  = false
keyboard_focus   = "exclusive"
