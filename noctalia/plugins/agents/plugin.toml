id          = "smudgenix/agents"
name        = "Agents"
version     = "0.5.0"
plugin_api  = 56
author      = "smudgenix"
icon        = "robot"
description = "Agents, as part of the desktop (via smx ai)."

[[service]]
id    = "watch"
entry = "service.luau"

[[widget]]
id    = "agents"
entry = "widget.luau"

[[panel]]
id               = "sessions"
entry            = "panel.luau"
width            = 560
height           = "content"
max_height       = 640
placement        = "floating"
position         = "center"
open_near_click  = false
keyboard_focus   = "exclusive"
capture_keys     = [ "Up", "Down", "Left", "Right", "k", "j", "h", "l", "Return" ]
