id          = "smudgenix/agents"
name        = "Agents"
version     = "0.18.0"
plugin_api  = 56
author      = "smudgenix"
icon        = "robot"
description = "Agents, as part of the desktop (via smx ai)."

[[setting]]
key             = "notify"
type            = "bool"
label_key       = "settings.notify.label"
description_key = "settings.notify.description"
default         = true

[[service]]
id    = "watch"
entry = "service.luau"

[[widget]]
id    = "agents"
entry = "widget.luau"

  [[widget.setting]]
  key             = "keys"
  type            = "string"
  label_key       = "settings.keys.label"
  description_key = "settings.keys.description"
  default         = ""

[[panel]]
id               = "sessions"
entry            = "panel.luau"
width            = 720
height           = "content"
max_height       = 640
placement        = "attached"
position         = "center"
open_near_click  = false
keyboard_focus   = "exclusive"
capture_keys     = [ "Up", "Down", "Left", "Right", "k", "j", "h", "l", "Return", "Tab", "Shift+Tab", "Shift+ISO_Left_Tab" ]
