id          = "smudgenix/agents"
name        = "Agents"
version     = "0.16.0"
plugin_api  = 56
author      = "smudgenix"
icon        = "robot"
description = "Agents, as part of the desktop (via smx ai)."

[[setting]]
key             = "notify"
type            = "bool"
label_key       = "settings.notify.label"
description_key = "settings.notify.description"
default         = true

[[service]]
id    = "watch"
entry = "service.luau"

[[widget]]
id    = "agents"
entry = "widget.luau"

[[panel]]
id               = "sessions"
entry            = "panel.luau"
width            = 720
height           = "content"
max_height       = 640
placement        = "attached"
position         = "center"
open_near_click  = false
keyboard_focus   = "exclusive"
capture_keys     = [ "Up", "Down", "Left", "Right", "k", "j", "h", "l", "Return", "Shift+Return", "Tab", "Shift+Tab", "Shift+ISO_Left_Tab", "a", "Shift+A", "d", "n", "r", "z", "c", "x", "s", "v", "e", "w", "o", "1", "2", "3", "4", "Shift+J", "Shift+K" ]
